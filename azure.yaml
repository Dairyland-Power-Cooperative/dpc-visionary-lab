# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: dpc-visionary-lab-1
metadata:
    template: azd-init@1.17.0
services:
    frontend:
        project: frontend
        host: containerapp
        language: ts
        docker:
            path: Dockerfile
    backend:
        project: backend
        host: containerapp
        language: python
        docker:
            path: Dockerfile
resources:
    frontend:
        type: host.containerapp
        port: 3000
    backend:
        type: host.containerapp
        port: 80
